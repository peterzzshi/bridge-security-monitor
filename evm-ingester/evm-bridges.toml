[[bridge]]
name = "Wormhole"
protocol = "wormhole"
address = "0x3ee18B2214AFF97000D974cf647E7C347E8fa585"
# The token bridge emits TransferRedeemed on unlock but nothing on lock; outgoing transfers
# publish LogMessagePublished here instead. Subscribed alongside `address` so lock and unlock
# events keep the same bridge identity (and therefore the same aggregator key).
core_address = "0x98f3c9e6E3fAce36bAAd05FE09d375Ef1464288B"

[[bridge]]
name = "LayerZero"
protocol = "layerzero"
address = "0x1a44076050125825900e736c501f859c50fE728c"

# Tokens that cross both EVM and Solana via these bridges, enabling supply mismatch detection.
# Addresses are the canonical EVM representations; Solana counterparts are in solana-bridges.toml.
[tokens."0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"]
symbol = "WETH"
decimals = 18

[tokens."0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"]
symbol = "USDC"
decimals = 6

[tokens."0xdAC17F958D2ee523a2206206994597C13D831ec7"]
symbol = "USDT"
decimals = 6
